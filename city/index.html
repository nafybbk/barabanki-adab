<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barabanki — Shehr ka Safarnama</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/main.css">
</head>
<body data-page="city">
<div class="grain"></div>
<div id="site-header"></div>

<section class="hero">
  <div>
    <div class="hero-eyebrow" id="city-name-ur"></div>
    <h1 id="city-name-en" style="font-size:46px;"></h1>
    <p class="hero-sub" id="city-intro"></p>
    <div class="hero-actions">
      <a href="dargah.html" class="btn btn-primary">Dargah aur ziyarat</a>
      <a href="guide.html" class="btn btn-ghost">Poori guide dekhein</a>
    </div>
  </div>
  <div class="hero-art">
    <div class="hero-art-verse">بارہ بنکی<br><span style="font-size:16px; opacity:0.8;">مٹی جس نے شاعر پیدا کیے</span></div>
  </div>
</section>

<section class="section section-tight">
  <div class="eyebrow">Tareekh</div>
  <h2 style="font-size:30px; margin-bottom:20px;">Ek nazar mazi par</h2>
  <p class="muted" id="city-history" style="max-width:75ch; font-size:16px;"></p>
</section>

<div class="divider"></div>

<section class="section section-tight">
  <div class="eyebrow">Shayer-e-Barabanki</div>
  <h2 style="font-size:30px; margin-bottom:30px;">Is zameen ke sukhanwar</h2>
  <div class="grid-2" id="poets-grid"></div>
</section>

<div class="divider"></div>

<section class="section section-tight">
  <div class="eyebrow">Rehnuma</div>
  <h2 style="font-size:30px; margin-bottom:30px;">Barabanki explore karein</h2>
  <div class="grid-4">
    <a href="dargah.html" class="card center">🕌<div style="margin-top:10px; font-family:var(--font-ui); font-weight:600;">Dargah aur Ziyarat</div></a>
    <a href="services.html" class="card center">🚑<div style="margin-top:10px; font-family:var(--font-ui); font-weight:600;">Emergency aur Khidmaat</div></a>
    <a href="guide.html" class="card center">🏙️<div style="margin-top:10px; font-family:var(--font-ui); font-weight:600;">Guide aur Bazaar</div></a>
    <a href="guide.html#jobs" class="card center">💼<div style="margin-top:10px; font-family:var(--font-ui); font-weight:600;">Job Openings</div></a>
  </div>
</section>

<div id="site-footer"></div>

<script src="../assets/js/data.js?v=17"></script>
<script src="../assets/js/components.js?v=17"></script>
<script src="../assets/js/chrome.js?v=17"></script>
<script src="../assets/js/i18n.js?v=17"></script>
<script src="../assets/js/auth.js?v=17"></script>
<script src="../assets/js/auth-widget.js?v=17"></script>
<script>
  const { city, poets } = SITE_DATA;
  document.getElementById("city-name-ur").textContent = city.nameUrdu;
  document.getElementById("city-name-en").textContent = city.name;
  document.getElementById("city-intro").textContent = city.intro;
  document.getElementById("city-history").textContent = city.history;
  document.getElementById("poets-grid").innerHTML = poets.map(Components.poetCard).join("");
</script>
</body>
</html>
