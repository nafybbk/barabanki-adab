<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kitab Padhein</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/main.css?v=7">
<!-- DearFlip (self-hosted, free "Lite" build, CC BY-NC-ND 4.0) — 2026-09-15.
     Replaces two earlier attempts:
     1. A hand-rolled PDF.js + Hammer.js reader — its zoom/pan/page-turn
        never fully worked on real phones despite passing every check
        runnable from a desktop/emulated browser.
     2. A Heyzine iframe embed — worked, but Heyzine's free tier only gives
        a hosted link, not a downloadable/self-hostable file, which is a
        real long-term dependency risk for a family archive site.
     DearFlip ships its own PDF.js/THREE.js/jQuery, lives entirely under
     assets/vendor/dflip/ (no third-party server involved), and has a
     documented `direction` option that correctly mirrors real RTL book
     physics (cover and lower page numbers on the right, higher pages on
     the left) — verified against Zikr-e-Karbala before wiring in below.
     Used strictly through its public HTML-attribute/JS-option API per its
     NoDerivatives license — nothing inside dflip's own files is touched. -->
<link href="../assets/vendor/dflip/css/dflip.min.css" rel="stylesheet" type="text/css">
<link href="../assets/vendor/dflip/css/themify-icons.min.css" rel="stylesheet" type="text/css">
</head>
<body data-page="books">
<div class="grain"></div>
<div id="site-header"></div>

<section class="section" style="padding-bottom:20px;">
  <a href="index.html" class="btn btn-ghost" style="margin-bottom:20px;">← Sab kitabein</a>
  <h1 id="book-title" style="font-size:32px;"></h1>
  <p class="muted" id="book-desc" style="max-width:60ch; margin-top:8px;"></p>
</section>

<section class="section section-tight" style="padding-top:0;">
  <div id="df-book-mount"></div>

  <div style="margin-top:24px; text-align:center;">
    <a id="download-link" href="#" class="btn btn-gold" download>PDF download karein</a>
  </div>
</section>

<div id="site-footer"></div>

<script src="../assets/js/data.js?v=8"></script>
<script src="../assets/js/chrome.js?v=8"></script>
<script src="../assets/js/i18n.js?v=8"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const bookId = params.get("id");
  const book = SITE_DATA.books.find(b => b.id === bookId) || SITE_DATA.books[0];

  document.getElementById("book-title").innerHTML =
    `<span class="h-urdu">${book.titleUrdu}</span> <span class="muted" style="font-size:18px;">— ${book.title}</span>`;
  document.getElementById("book-desc").textContent = book.description;
  document.getElementById("download-link").href = "../" + book.pdf;

  // Built before dflip.min.js loads below, so its own document-ready scan
  // for ._df_book elements picks up the correct source/direction from the
  // start. `book.rtl` (data.js) drives DFLIP.DIRECTION — 2 for RTL Urdu
  // books, 1 (default) for any future LTR one.
  document.getElementById("df-book-mount").innerHTML = `
    <div class="_df_book"
         source="../${book.pdf}"
         direction="${book.rtl ? 2 : 1}"
         height="640"
         webgl="true"
         backgroundcolor="#3a0a12">
    </div>`;
</script>
<script src="../assets/vendor/dflip/js/libs/jquery.min.js" type="text/javascript"></script>
<script src="../assets/vendor/dflip/js/dflip.min.js" type="text/javascript"></script>
</body>
</html>
