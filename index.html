<script src="assets/js/data.js?v=11"></script>
<script src="assets/js/components.js?v=11"></script>
<script src="assets/js/chrome.js?v=11"></script>
<script src="assets/js/i18n.js?v=11"></script>
<script>
  const { poet, bazm, city, books, poems } = SITE_DATA;

  document.getElementById("poet-name-heading").innerHTML = `${poet.name} <span class="h-urdu" style="font-size:22px; display:block; margin-top:6px;">${poet.nameUrdu}</span>`;
  // Real bug (2026-09-15): the <img> starts with src="" in the static markup,
  // which fires its own onerror handler almost immediately and REMOVES the
  // element (see the onerror attribute above) — long before this script runs.
  // Setting .src unconditionally on the now-missing element threw here and
  // silently killed every statement below it (book-grid, poem-teaser,
  // bazm-teaser, city-intro-text never ran) — that's why the whole rest of
  // the homepage looked "empty", not because that code didn't exist.
  const photoEl = document.getElementById("poet-photo");
  if (photoEl) photoEl.src = poet.photo;

  document.getElementById("book-grid").innerHTML = books.map(b => {
    const href = b.external ? b.external : `books/reader.html?id=${b.id}`;
    const targetAttrs = b.external ? ` target="_blank" rel="noopener"` : "";
    return `
    <a href="${href}"${targetAttrs} class="book-card">
      <div class="book-cover">
        <img src="${b.cover}" alt="${b.title}" loading="lazy"
             onerror="const p=this.parentElement; this.remove(); p.classList.add('book-cover--fallback'); p.setAttribute('data-title','${b.titleUrdu}')">
        <div class="book-cover-spine"></div>
        ${b.external ? '<div class="book-cover-badge">Rekhta</div>' : ""}
      </div>
      <div class="book-meta">
        <div class="book-title-ur">${b.titleUrdu}</div>
        <div class="book-title-en">${b.title} · ${b.year}</div>
      </div>
    </a>`;
  }).join("");

  // Real bug (2026-09-15): tagline/bio/intro/poem text always used the base
  // (English) SITE_DATA field, regardless of the selected language — the
  // Urdu/Hindi fields (taglineUrdu, bioHindi, etc.) already existed in
  // data.js but nothing ever read them. fieldForLang() (i18n.js) picks the
  // right field per language; this now re-runs on every language switch via
  // the renderPageContent hook, same pattern as the Bazm widget uses.
  window.renderPageContent = function (lang) {
    document.getElementById("poet-tagline").textContent = poet[fieldForLang("tagline", lang)];
    document.getElementById("poet-bio").textContent = poet[fieldForLang("bio", lang)];
    document.getElementById("bazm-teaser").textContent = bazm[fieldForLang("intro", lang)];
    document.getElementById("city-intro-text").textContent = city[fieldForLang("intro", lang)];

    document.getElementById("poem-teaser").innerHTML = poems.slice(0, 2).map(p => `
      <article class="poem-card">
        <div class="poem-card-head">
          <span class="pill">${p.book}</span>
          <span class="muted" style="font-size:13px;">${p.title}</span>
        </div>
        <p class="poem-text">${p.textUrdu.replace(/\n/g, "<br>")}</p>
      </article>`).join("");
  };
  window.renderPageContent(LangStore.get());
</script>
