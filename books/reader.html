<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<!-- user-scalable=no (reader page only — not the rest of the site): native
     pinch-zoom bypasses this reader's own in-app zoom state entirely (it
     only tracks +/- button / ctrl+wheel / keyboard zoom). A user pinch-
     zooming natively leaves the app still thinking it's at 100%, so its
     tap/swipe-to-turn-page logic (only meant to be active at 100%) stays
     engaged instead of the drag-to-pan logic (only active when zoomed) -
     confirmed real bug 2026-09-15: "touch moves the page = turns it,
     dragging doesn't pan" is exactly what happens when native zoom and the
     app's own zoom tracking disagree. The in-app zoom (up to 300%, via the
     +/- buttons) already covers the same need, so funnelling all zooming
     through it keeps the two in sync. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kitab Padhein</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/main.css?v=7">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<!-- Hammer.js: mature, battle-tested gesture recognizer (pinch/pan/tap) —
     2026-09-15 replaces hand-rolled Pointer Event math for zoom/pan/tap.
     Reason for the swap: the hand-rolled version only ever tracked ONE
     pointer, so real two-finger pinch was never actually implemented (only
     +/- buttons and ctrl+wheel worked) and had no defined behaviour for a
     second finger landing mid-drag. Hammer's Pan recognizer requires exactly
     1 pointer, so a second finger touching down cleanly ends any in-progress
     pan and hands off to Pinch — the exact "accidental page-turn while
     zooming" class of bug is handled by the library's own state machine
     instead of more manual if-branches. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
</head>
<body data-page="books">
<div class="grain"></div>
<div id="site-header"></div>

<section class="section" style="padding-bottom:20px;">
  <a href="index.html" class="btn btn-ghost" style="margin-bottom:20px;">← Sab kitabein</a>
  <h1 id="book-title" style="font-size:32px;"></h1>
  <p class="muted" id="book-desc" style="max-width:60ch; margin-top:8px;"></p>
</section>

<section class="section section-tight" style="padding-top:0;">
  <div class="reader-shell">
    <div class="reader-overlay">
      <!-- Single always-visible strip (2026-09-15): the earlier 3-row
           overlay ate too much of the actual page. Only nav + zoom + fs sit
           here permanently; the mode-toggle/goto/slider (rarely touched)
           move behind "⋯" so the default footprint is one thin bar. -->
      <div class="reader-overlay-row">
        <div class="reader-controls">
          <button id="btn-first" class="reader-jump-btn" aria-label="Pehla safha" title="Pehla safha">⇤</button>
          <button id="btn-prev" aria-label="Agla safha">‹</button>
          <div class="reader-page-num" id="page-num">— / —</div>
          <button id="btn-next" aria-label="Pichla safha">›</button>
          <button id="btn-last" class="reader-jump-btn" aria-label="Aakhri safha" title="Aakhri safha">⇥</button>
        </div>
        <div class="reader-zoom" id="zoom-controls">
          <button type="button" id="zoom-out" aria-label="Zoom kam karein" title="Zoom kam (−)">−</button>
          <span class="zoom-level" id="zoom-level">100%</span>
          <button type="button" id="zoom-in" aria-label="Zoom badhayein" title="Zoom zyada (+)">+</button>
          <button type="button" id="zoom-reset" aria-label="Zoom reset" title="Zoom reset" style="font-size:11px;">⟲</button>
        </div>
        <button type="button" class="reader-fs-btn" id="btn-fullscreen" aria-label="Poori screen" title="Poori screen">⛶</button>
        <button type="button" class="reader-fs-btn" id="btn-more" aria-label="Aur options" title="Aur options">⋯</button>
      </div>
      <div class="reader-overlay-row" id="overlay-more" style="display:none;">
        <div class="reader-view-toggle" id="view-toggle">
          <button type="button" data-mode="single" id="mode-single">Ek Safha</button>
          <button type="button" data-mode="spread" id="mode-spread">Do Safhe</button>
        </div>
        <div class="reader-goto">
          <input type="number" id="goto-input" min="1" inputmode="numeric" placeholder="Safha #">
          <button id="goto-btn" type="button">Jao</button>
        </div>
      </div>
      <div class="reader-slider" id="overlay-slider" style="display:none;">
        <span class="slider-label">Aakhir</span>
        <input type="range" id="page-slider" dir="rtl" min="1" max="1" value="1" aria-label="Safhon par phisalein">
        <span class="slider-label">Shuru</span>
      </div>
    </div>
    <div class="reader-page-wrap">
      <div class="reader-zoom-layer" id="zoom-layer">
        <div class="reader-book" id="reader-book">
          <div class="leaf-wrap">
            <div class="reader-leaf" id="leaf-left">
              <div style="color: var(--ink-soft); font-family: var(--font-ui); text-align:center;" id="reader-status">
                Kitab load ho rahi hai&hellip;
              </div>
              <div class="reader-canvas-stack" id="stack-left"></div>
            </div>
            <div class="sparkle-layer" id="sparkle-left"></div>
          </div>
          <div class="leaf-wrap" id="leaf-wrap-right" style="display:none;">
            <div class="reader-leaf reader-leaf--right" id="leaf-right">
              <div class="reader-canvas-stack" id="stack-right"></div>
            </div>
            <div class="sparkle-layer" id="sparkle-right"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div style="margin-top:24px; text-align:center;">
    <a id="download-link" href="#" class="btn btn-gold" download>PDF download karein</a>
  </div>
</section>

<div id="site-footer"></div>

<script src="../assets/js/data.js?v=8"></script>
<script src="../assets/js/chrome.js?v=8"></script>
<script src="../assets/js/i18n.js?v=8"></script>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  const params = new URLSearchParams(window.location.search);
  const bookId = params.get("id");
  const book = SITE_DATA.books.find(b => b.id === bookId) || SITE_DATA.books[0];

  document.getElementById("book-title").innerHTML =
    `<span class="h-urdu">${book.titleUrdu}</span> <span class="muted" style="font-size:18px;">— ${book.title}</span>`;
  document.getElementById("book-desc").textContent = book.description;
  document.getElementById("download-link").href = "../" + book.pdf;

  const statusEl = document.getElementById("reader-status");
  const bookEl = document.getElementById("reader-book");
  const leafWrapRight = document.getElementById("leaf-wrap-right");
  const stackLeft = document.getElementById("stack-left");
  const stackRight = document.getElementById("stack-right");
  const sparkleLeft = document.getElementById("sparkle-left");
  const sparkleRight = document.getElementById("sparkle-right");
  const pageNumEl = document.getElementById("page-num");
  const btnPrev = document.getElementById("btn-prev");
  const btnNext = document.getElementById("btn-next");
  const btnFirst = document.getElementById("btn-first");
  const btnLast = document.getElementById("btn-last");
  const gotoInput = document.getElementById("goto-input");
  const gotoBtn = document.getElementById("goto-btn");
  const modeSingleBtn = document.getElementById("mode-single");
  const modeSpreadBtn = document.getElementById("mode-spread");
  const shellEl = document.querySelector(".reader-shell");
  const pageWrap = document.querySelector(".reader-page-wrap");
  const zoomLayer = document.getElementById("zoom-layer");
  const overlayEl = document.querySelector(".reader-overlay");
  const zoomInBtn = document.getElementById("zoom-in");
  const zoomOutBtn = document.getElementById("zoom-out");
  const zoomResetBtn = document.getElementById("zoom-reset");
  const zoomLevelEl = document.getElementById("zoom-level");
  const fsBtn = document.getElementById("btn-fullscreen");
  const moreBtn = document.getElementById("btn-more");
  const overlayMore = document.getElementById("overlay-more");
  const overlaySlider = document.getElementById("overlay-slider");
  const pageSlider = document.getElementById("page-slider");

  // "⋯" reveals the rarely-used mode-toggle/goto/slider row. Collapsed by
  // default so the overlay's resting footprint is one thin strip, per the
  // explicit ask: only nav+zoom+fullscreen stay permanently visible.
  let moreOpen = false;
  moreBtn.addEventListener("click", () => {
    moreOpen = !moreOpen;
    overlayMore.style.display = moreOpen ? "flex" : "none";
    overlaySlider.style.display = moreOpen ? "flex" : "none";
    moreBtn.textContent = moreOpen ? "✕" : "⋯";
    updateLayoutSize();
  });

  // Urdu kitab hai — safhe RTL order mein palte hain: khulay panne mein
  // ZIYADA (aage ka) safha screen ke BAAYEIN (left) taraf hota hai, aur
  // KAM (peechay ka) safha DAAYEIN (right) taraf — jaise asli Urdu kitab mein.
  const RTL_BOOK = true;

  let pdfDoc = null;
  let currentPage = 1; // left-most page currently shown
  let rendering = false;
  let viewMode = localStorage.getItem("adab-reader-view") ||
    (window.innerWidth >= 980 ? "spread" : "single");

  function applyViewMode() {
    modeSingleBtn.classList.toggle("active", viewMode === "single");
    modeSpreadBtn.classList.toggle("active", viewMode === "spread");
    bookEl.classList.toggle("is-spread", viewMode === "spread");
  }
  modeSingleBtn.addEventListener("click", () => switchMode("single"));
  modeSpreadBtn.addEventListener("click", () => switchMode("spread"));
  function switchMode(mode) {
    if (mode === viewMode) return;
    viewMode = mode;
    localStorage.setItem("adab-reader-view", mode);
    applyViewMode();
    panX = 0; panY = 0; applyTransform();
    updateLayoutSize(); // leaf-height's width-fit depends on 1-leaf vs 2-leaf
    if (pdfDoc) renderSpread(currentPage, null);
  }
  applyViewMode();

  // ---- In-app zoom/pan (2026-09-15 rewrite) ----
  // Real architecture fix: zoom/pan is now PURELY a CSS transform on one
  // wrapper (.reader-zoom-layer) - translate+scale, GPU-composited, never
  // touching box-model sizing (leaf-wrap/reader-leaf are fixed size always).
  // The page-turn curl animation lives on .page-canvas, several levels
  // DEEPER inside that same wrapper - nested transforms compose correctly
  // with zero interaction between the two, so zooming can never distort a
  // mid-turn curl and turning a page can never fight the pan position.
  // This also fully replaces the old scrollLeft-based centering, which
  // depended on plain-LTR scroll semantics and broke under body[dir="rtl"]
  // (Urdu mode) - a transform's translate() value means the same thing
  // regardless of the page's text direction, so that whole class of bug is
  // gone rather than patched.
  const ZOOM_MIN = 1, ZOOM_MAX = 3, ZOOM_STEP = 0.25;
  let zoom = 1, panX = 0, panY = 0;
  function setZoom(z) {
    z = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, Math.round(z * 100) / 100));
    if (z === zoom) return;
    zoom = z;
    panX = 0; panY = 0; // recentre on every explicit zoom change
    applyZoom();
  }
  function applyZoom() {
    zoomLevelEl.textContent = Math.round(zoom * 100) + "%";
    zoomInBtn.disabled = zoom >= ZOOM_MAX;
    zoomOutBtn.disabled = zoom <= ZOOM_MIN;
    pageWrap.classList.toggle("is-zoomed", zoom > 1);
    applyTransform();
  }
  // translate() listed BEFORE scale() so the pan amount is in real, unscaled
  // screen pixels — a 40px finger drag moves the content 40px on screen at
  // ANY zoom level, matching the finger 1:1, rather than the drag distance
  // itself getting scaled up/down by the zoom level.
  function applyTransform() {
    zoomLayer.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
  }
  zoomInBtn.addEventListener("click", () => setZoom(zoom + ZOOM_STEP));
  zoomOutBtn.addEventListener("click", () => setZoom(zoom - ZOOM_STEP));
  zoomResetBtn.addEventListener("click", () => setZoom(1));
  applyTransform();

  // Ctrl+scroll over the book zooms the book, not the whole page.
  pageWrap.addEventListener("wheel", (e) => {
    if (!e.ctrlKey) return;
    e.preventDefault();
    setZoom(zoom + (e.deltaY < 0 ? ZOOM_STEP : -ZOOM_STEP));
  }, { passive: false });

  // ---- Gesture layer (Hammer.js) — three DISTINCT recognizers, kept
  // deliberately separate rather than one blob of pointer-math:
  //   Pinch  -> zoom (always live, 2 fingers)
  //   Pan    -> drag-to-pan, but ONLY acted on while zoom > 1 (1 finger)
  //   Tap    -> turn one page (only at zoom == 1)
  // Pan requires exactly 1 pointer, so a second finger landing mid-drag
  // ends the pan and Pinch takes over on its own — no manual bookkeeping
  // needed for "accidental page-turn while zooming".
  const mc = new Hammer.Manager(pageWrap, { touchAction: "none" });
  const pinchRec = new Hammer.Pinch({ threshold: 0 });
  const panRec = new Hammer.Pan({ direction: Hammer.DIRECTION_ALL, threshold: 10 });
  const tapRec = new Hammer.Tap();
  mc.add([pinchRec, panRec, tapRec]);
  panRec.recognizeWith(pinchRec); // let both fire during a 2-finger touch

  let pinchActive = false;
  let gestureZoom0 = 1, gesturePanX0 = 0, gesturePanY0 = 0;

  mc.on("pinchstart", () => {
    pinchActive = true;
    gestureZoom0 = zoom;
    gesturePanX0 = panX;
    gesturePanY0 = panY;
  });
  mc.on("pinch", (e) => {
    // deltaX/deltaY track the pinch centre's own movement since gesture
    // start, so the content follows the fingers while it scales — not just
    // zooming in place around a fixed centre.
    zoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, gestureZoom0 * e.scale));
    panX = gesturePanX0 + e.deltaX;
    panY = gesturePanY0 + e.deltaY;
    zoomLevelEl.textContent = Math.round(zoom * 100) + "%";
    zoomInBtn.disabled = zoom >= ZOOM_MAX;
    zoomOutBtn.disabled = zoom <= ZOOM_MIN;
    pageWrap.classList.toggle("is-zoomed", zoom > 1);
    applyTransform();
  });
  mc.on("pinchend pinchcancel", () => {
    zoom = Math.round(zoom * 100) / 100;
    if (zoom <= 1) { zoom = 1; panX = 0; panY = 0; pageWrap.classList.remove("is-zoomed"); applyTransform(); }
    pinchActive = false;
  });

  mc.on("panstart", () => {
    if (pinchActive) return;
    gesturePanX0 = panX;
    gesturePanY0 = panY;
  });
  mc.on("panmove", (e) => {
    if (pinchActive || zoom <= 1) return; // at zoom==1, pan is left for panend's swipe check
    panX = gesturePanX0 + e.deltaX;
    panY = gesturePanY0 + e.deltaY;
    applyTransform();
  });
  mc.on("panend pancancel", (e) => {
    if (pinchActive) return;
    if (zoom === 1 && Math.abs(e.deltaX) > 60 && Math.abs(e.deltaX) > Math.abs(e.deltaY)) {
      // Swipe: RTL kitab mein agla safha baayein se aata hai,
      // isliye daayein taraf swipe = aage badhna.
      if (e.deltaX > 0) (RTL_BOOK ? goForward() : goBackward());
      else (RTL_BOOK ? goBackward() : goForward());
    }
  });

  mc.on("tap", (e) => {
    if (zoom !== 1) return;
    if (!e.target.closest(".leaf-wrap")) return;
    // Tap on a page: left half = the visually-left button's action.
    const rect = bookEl.getBoundingClientRect();
    const leftHalf = e.center.x < rect.left + rect.width / 2;
    if (leftHalf) (RTL_BOOK ? goForward() : goBackward());
    else (RTL_BOOK ? goBackward() : goForward());
  });

  // ---- Fullscreen ----
  fsBtn.addEventListener("click", () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (shellEl.requestFullscreen) shellEl.requestFullscreen().catch(() => {});
  });
  // Explicit px sizing measured from the REAL, currently-rendered overlay
  // height (2026-09-15) rather than any vh-based guess: mobile browsers'
  // 100vh famously includes the space behind their own collapsible address
  // bar, which is not actually visible screen — a vh-based leaf height
  // reliably overshot the real available space on a real phone (confirmed:
  // the overlay measured far taller in practice than assumed, pushing the
  // book mostly below the fold). Measuring offsetHeight directly and
  // re-running on resize/fullscreenchange/orientation-change stays correct
  // regardless of address-bar state or how many rows the overlay wraps to
  // on a given device width.
  function updateLayoutSize() {
    const overlayH = overlayEl.offsetHeight;
    const availH = Math.max(300, window.innerHeight - overlayH - 12);

    // Height-only sizing (the original 2026-09-15 fix) still overflows
    // sideways on a narrow-but-tall viewport: .reader-leaf is a fixed 3:4
    // aspect ratio, so a height picked with no regard for available WIDTH
    // can demand a leaf wider than the screen — confirmed empirically
    // (349x957 test viewport produced a 653px-wide leaf inside a 349px-wide
    // shell, overflowing both edges since .reader-page-wrap centers it).
    // Spread mode shows two such leaves side by side, so it hits this ceiling
    // at a taller/narrower viewport than single mode does.
    const availW = Math.max(200, shellEl.clientWidth - 16);
    const leavesAcross = viewMode === "spread" ? 2 : 1;
    const gap = leavesAcross === 2 ? 3 : 0;
    const maxHFromWidth = ((availW - gap) / leavesAcross) * (4 / 3);

    const available = Math.min(availH, maxHFromWidth);
    shellEl.style.setProperty("--leaf-h", available + "px");
    pageWrap.style.height = (available + 16) + "px";
  }
  document.addEventListener("fullscreenchange", () => {
    const fs = document.fullscreenElement === shellEl;
    fsBtn.textContent = fs ? "✕" : "⛶";
    fsBtn.title = fs ? "Poori screen band karein" : "Poori screen";
    updateLayoutSize();
  });
  window.addEventListener("resize", updateLayoutSize);
  updateLayoutSize();

  // ---- Page slider (RTL) ----
  pageSlider.addEventListener("input", () => {
    const n = parseInt(pageSlider.value, 10);
    if (pdfDoc && !isNaN(n)) pageNumEl.textContent = `Safha ${n} / ${pdfDoc.numPages}`;
  });
  pageSlider.addEventListener("change", () => {
    const n = parseInt(pageSlider.value, 10);
    if (!isNaN(n)) jumpTo(n);
  });

  const POS_KEY = "adab-reader-pos-" + book.id;

  async function loadBook() {
    try {
      const task = pdfjsLib.getDocument("../" + book.pdf);
      task.onProgress = ({ loaded, total }) => {
        if (total) statusEl.textContent = `Kitab load ho rahi hai… ${Math.min(100, Math.round((loaded / total) * 100))}%`;
      };
      pdfDoc = await task.promise;
      // Pichhli baar jahan chhoda tha, wahin se kholo.
      const saved = parseInt(localStorage.getItem(POS_KEY), 10);
      const startPage = !isNaN(saved) && saved > 1 && saved <= pdfDoc.numPages ? saved : 1;
      await renderSpread(startPage, null);
    } catch (err) {
      console.error("reader loadBook failed:", err);
      statusEl.style.display = "";
      statusEl.innerHTML = `
        PDF abhi upload nahi hui hai.<br>
        <span style="font-size:13px; opacity:0.7;">(${book.pdf} is folder mein daalne ke baad kitab yahan khulegi)</span>
      `;
      pageNumEl.textContent = "— / —";
      btnPrev.disabled = true;
      btnNext.disabled = true;
    }
  }

  const SPARKLE_CHARS = ["✦", "✧", "★", "✨", "❋"];
  const SPARKLE_COLORS = ["#e6c069", "#f4dfa0", "#caa356", "#fff4d6"];

  function spawnSparkles(sparkleEl, edge) {
    const count = 14 + Math.floor(Math.random() * 6);
    const frag = document.createDocumentFragment();
    for (let i = 0; i < count; i++) {
      const s = document.createElement("span");
      s.className = "sparkle";
      const sy = Math.random() * 100;
      const sx = edge === "right" ? 100 - Math.random() * 6 : Math.random() * 6;
      const flingX = (edge === "right" ? 1 : -1) * (60 + Math.random() * 140);
      const flingY = (Math.random() - 0.6) * 140;
      s.style.setProperty("--sx", sx + "%");
      s.style.setProperty("--sy", sy + "%");
      s.style.setProperty("--sdx", flingX + "px");
      s.style.setProperty("--sdy", flingY + "px");
      s.style.setProperty("--srot", (Math.random() * 360 - 180) + "deg");
      s.style.setProperty("--ssize", (10 + Math.random() * 14) + "px");
      s.style.setProperty("--sdur", (0.6 + Math.random() * 0.5) + "s");
      s.style.setProperty("--sdelay", (Math.random() * 0.15) + "s");
      s.style.setProperty("--scolor", SPARKLE_COLORS[i % SPARKLE_COLORS.length]);
      s.textContent = SPARKLE_CHARS[i % SPARKLE_CHARS.length];
      s.addEventListener("animationend", () => s.remove());
      frag.appendChild(s);
    }
    sparkleEl.appendChild(frag);
  }

  async function renderLeaf(stackEl, sparkleEl, num, direction) {
    if (!num || num < 1 || num > pdfDoc.numPages) {
      stackEl.innerHTML = "";
      return;
    }
    const page = await pdfDoc.getPage(num);

    // Display size is plain CSS percentage (100% of the stack box) so it
    // auto-follows browser zoom / window resize with no JS involved — a
    // fixed pixel size computed once would go stale the moment the user
    // zooms without turning a page. Raster resolution is rendered generously
    // high (independent of the live box size) so it stays crisp at any zoom.
    // Capped because devicePixelRatio grows with browser zoom in Chromium;
    // at 500% zoom an uncapped 2.4*dpr canvas becomes tens of megapixels
    // and page.render() silently fails or crawls.
    const dpr = window.devicePixelRatio || 1;
    const renderScale = Math.min(2.4 * dpr, 5);
    const renderViewport = page.getViewport({ scale: renderScale });

    const newCanvas = document.createElement("canvas");
    newCanvas.width = renderViewport.width;
    newCanvas.height = renderViewport.height;
    newCanvas.className = "page-canvas turn-in";

    const ctx = newCanvas.getContext("2d");
    await page.render({ canvasContext: ctx, viewport: renderViewport }).promise;

    // direction here is a visual curl direction: "curl-right" | "curl-left" | null
    const oldCanvas = stackEl.querySelector(".page-canvas.settled");
    if (oldCanvas && direction) {
      oldCanvas.classList.remove("settled");
      oldCanvas.classList.add(direction === "curl-right" ? "turn-out-next" : "turn-out-prev");
      oldCanvas.addEventListener("animationend", () => oldCanvas.remove(), { once: true });
    } else if (oldCanvas) {
      oldCanvas.remove();
    }

    stackEl.appendChild(newCanvas);
    if (direction) spawnSparkles(sparkleEl, direction === "curl-right" ? "right" : "left");

    newCanvas.addEventListener("animationend", () => {
      newCanvas.classList.remove("turn-in");
      newCanvas.classList.add("settled");
    }, { once: true });
  }

  // Returns { lowNum, highNum } for the spread that contains `num`.
  // Page 1 (the cover) is always shown alone; after that pages pair up (2,3) (4,5) ...
  // lowNum is always the smaller page number, highNum the larger (or null in single mode).
  function spreadPagesFor(num) {
    if (viewMode === "single") return { lowNum: num, highNum: null };
    if (num <= 1) return { lowNum: 1, highNum: null };
    const lowNum = num % 2 === 0 ? num : num - 1;
    return { lowNum, highNum: lowNum + 1 <= pdfDoc.numPages ? lowNum + 1 : null };
  }

  async function renderSpread(num, dirForward) {
    // dirForward: true = moving deeper into the book (higher page numbers),
    // false = moving back toward the cover, null/undefined = no animation (jump/mode switch).
    if (!pdfDoc || rendering) return;
    rendering = true;
    statusEl.style.display = "none";

    const { lowNum, highNum } = spreadPagesFor(num);
    leafWrapRight.style.display = highNum ? "" : "none";

    // Urdu/RTL book: the earlier (low) page sits on the physical RIGHT,
    // the later (high) page sits on the physical LEFT.
    const domLeftPage = RTL_BOOK ? (highNum || lowNum) : lowNum;
    const domRightPage = RTL_BOOK ? (highNum ? lowNum : null) : highNum;

    // Moving forward (higher page numbers) visually curls toward the left
    // in an RTL book (pages are "used up" from right to left).
    let curlDir = null;
    if (dirForward === true) curlDir = RTL_BOOK ? "curl-left" : "curl-right";
    if (dirForward === false) curlDir = RTL_BOOK ? "curl-right" : "curl-left";

    await Promise.all([
      renderLeaf(stackLeft, sparkleLeft, domLeftPage, curlDir),
      domRightPage ? renderLeaf(stackRight, sparkleRight, domRightPage, curlDir) : Promise.resolve(),
    ]);

    currentPage = lowNum;
    pageNumEl.textContent = highNum
      ? `Safha ${lowNum}–${highNum} / ${pdfDoc.numPages}`
      : `Safha ${lowNum} / ${pdfDoc.numPages}`;
    const atStart = lowNum <= 1;
    const atEnd = (highNum || lowNum) >= pdfDoc.numPages;
    // In an RTL book "next/forward" is the visually-LEFT button.
    btnPrev.disabled = RTL_BOOK ? atEnd : atStart;
    btnNext.disabled = RTL_BOOK ? atStart : atEnd;
    btnFirst.disabled = atStart;
    btnLast.disabled = atEnd;
    gotoInput.max = pdfDoc.numPages;
    pageSlider.max = pdfDoc.numPages;
    pageSlider.value = lowNum;
    // Yaad rakho ke reader kahan tak pahuncha tha (per-kitab).
    try {
      if (lowNum > 1) localStorage.setItem(POS_KEY, String(lowNum));
      else localStorage.removeItem(POS_KEY);
    } catch {}
    rendering = false;
  }

  function goForward() {
    if (!pdfDoc || rendering) return;
    const { lowNum, highNum } = spreadPagesFor(currentPage);
    const last = highNum || lowNum;
    if (last >= pdfDoc.numPages) return;
    renderSpread(last + 1, true);
  }
  function goBackward() {
    if (!pdfDoc || rendering) return;
    const { lowNum } = spreadPagesFor(currentPage);
    if (lowNum <= 1) return;
    renderSpread(lowNum - 1, false);
  }
  function jumpTo(num) {
    if (!pdfDoc || rendering) return;
    num = Math.max(1, Math.min(pdfDoc.numPages, num));
    const dir = num === currentPage ? null : num > currentPage;
    renderSpread(num, dir);
  }

  // Visually-left button = forward (deeper into book) for an RTL Urdu kitab.
  btnPrev.addEventListener("click", () => (RTL_BOOK ? goForward() : goBackward()));
  btnNext.addEventListener("click", () => (RTL_BOOK ? goBackward() : goForward()));
  btnFirst.addEventListener("click", () => jumpTo(1));
  btnLast.addEventListener("click", () => pdfDoc && jumpTo(pdfDoc.numPages));
  gotoBtn.addEventListener("click", () => {
    const n = parseInt(gotoInput.value, 10);
    if (!isNaN(n)) jumpTo(n);
  });
  gotoInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      const n = parseInt(gotoInput.value, 10);
      if (!isNaN(n)) jumpTo(n);
    }
  });
  document.addEventListener("keydown", (e) => {
    if (document.activeElement === gotoInput || document.activeElement === pageSlider) return;
    if (e.key === "ArrowLeft") (RTL_BOOK ? goForward() : goBackward());
    if (e.key === "ArrowRight") (RTL_BOOK ? goBackward() : goForward());
    if (e.key === "Home") jumpTo(1);
    if (e.key === "End" && pdfDoc) jumpTo(pdfDoc.numPages);
    if (e.key === "+" || e.key === "=") setZoom(zoom + ZOOM_STEP);
    if (e.key === "-" || e.key === "_") setZoom(zoom - ZOOM_STEP);
    if (e.key === "0") setZoom(1);
    if (e.key === "f" || e.key === "F") fsBtn.click();
  });

  loadBook();
</script>
</body>
</html>
