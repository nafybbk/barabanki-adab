<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bazm-e-Aziz — Taaruf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/main.css">
</head>
<body data-page="bazm">
<div class="grain"></div>
<div id="site-header"></div>

<section class="hero" style="grid-template-columns: 1fr;">
  <div class="center" style="max-width:720px; margin:0 auto;">
    <div class="hero-eyebrow" id="bazm-name-ur" style="text-align:center;"></div>
    <h1 id="bazm-name-en" style="font-size:44px;"></h1>
    <p class="hero-sub" style="margin:20px auto 0; text-align:center;" id="bazm-founded"></p>
  </div>
</section>

<section class="section section-tight">
  <div class="card" style="padding:44px; max-width:820px; margin:0 auto;">
    <p class="urdu" id="bazm-intro-ur" style="font-size:22px; line-height:2.2; margin-bottom:24px;"></p>
    <div class="divider" style="margin:30px 0;"></div>
    <p class="muted" id="bazm-intro-en" style="font-size:16px;"></p>
  </div>
</section>

<section class="section section-tight center">
  <div class="eyebrow" style="justify-content:center;">Shamil hon</div>
  <h2 style="font-size:30px; margin-bottom:20px;">Iss mehfil ka hissa banein</h2>
  <p class="muted" style="max-width:56ch; margin:0 auto 28px;">
    Agar aap Ustad sahab ke shagird hain ya Urdu shayeri se lagaav rakhte hain,
    Bazm-e-Aziz mein shamil hon aur apni tehreerein saanjha karein.
  </p>
  <a href="shagird/index.html" class="btn btn-primary">Shagird circle mein shamil hon</a>
</section>

<div id="site-footer"></div>

<script src="assets/js/data.js?v=8"></script>
<script src="assets/js/chrome.js?v=8"></script>
<script src="assets/js/i18n.js?v=8"></script>
<script>
  const { bazm } = SITE_DATA;
  document.getElementById("bazm-name-ur").textContent = bazm.nameUrdu;
  document.getElementById("bazm-name-en").textContent = bazm.name;
  document.getElementById("bazm-founded").textContent = `Qayam: ${bazm.founded}`;
  document.getElementById("bazm-intro-ur").textContent = bazm.introUrdu;
  document.getElementById("bazm-intro-en").textContent = bazm.intro;
</script>
</body>
</html>
