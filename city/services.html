<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emergency aur Khidmaat — Barabanki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/main.css">
</head>
<body data-page="city">
<div class="grain"></div>
<div id="site-header"></div>

<section class="section" style="padding-bottom:20px;">
  <a href="index.html" class="btn btn-ghost" style="margin-bottom:20px;">← Barabanki guide</a>
  <div class="eyebrow">Zaroori Khidmaat</div>
  <h1 style="font-size:40px; margin-bottom:14px;">Emergency Numbers aur Sehat</h1>
  <p class="muted" style="max-width:65ch;">
    Zaroorat ke waqt kaam aane wale numbers, mustanad haspatal, aur
    ta'leemi idaaray — sab ek jagah.
  </p>
</section>

<section class="section section-tight" style="padding-top:0;">
  <div class="grid-2" style="align-items:start; margin-bottom:30px;">
    <div id="emergency-card"></div>
    <div id="hospitals-card"></div>
  </div>
  <div class="grid-2" style="align-items:start;">
    <div id="schools-card"></div>
    <div id="parks-card"></div>
  </div>
</section>

<div id="site-footer"></div>

<script src="../assets/js/data.js?v=13"></script>
<script src="../assets/js/components.js?v=13"></script>
<script src="../assets/js/chrome.js?v=13"></script>
<script src="../assets/js/i18n.js?v=13"></script>
<script>
  const { emergency, hospitals, schools, parks } = SITE_DATA;

  document.getElementById("emergency-card").innerHTML = Components.simpleListCard(
    "🚨 Emergency Numbers", emergency, Components.emergencyRow
  );
  document.getElementById("hospitals-card").innerHTML = Components.simpleListCard(
    "🏥 Mustanad Haspatal", hospitals, (h) => Components.plainRow(h, "type")
  );
  document.getElementById("schools-card").innerHTML = Components.simpleListCard(
    "🏫 Schools aur Madaris", schools, (s) => Components.plainRow(s, "type")
  );
  document.getElementById("parks-card").innerHTML = Components.simpleListCard(
    "🌳 Parks", parks, (p) => Components.plainRow(p)
  );
</script>
</body>
</html>
