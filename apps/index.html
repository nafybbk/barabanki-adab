<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apps — Islami Auzaar</title>
<meta name="description" content="Naseer Ansari Barabankvi ke adabi khandan ki taraf se Islami aur adabi apps.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/main.css">
</head>
<body data-page="apps">
<div class="grain"></div>
<div id="site-header"></div>

<section class="section" style="padding-bottom:40px;">
  <a href="../index.html" class="btn btn-ghost" style="margin-bottom:20px;">← Ghar</a>
  <div class="eyebrow">Islami Auzaar</div>
  <h1 style="font-size:40px; margin-bottom:14px;">Apps</h1>
  <p class="muted" style="max-width:60ch;">
    Is adabi khandan ki taraf se banaye gaye Islami aur rozmarra ke kaam ke apps.
  </p>
</section>

<section class="section section-tight" style="padding-top:0;">
  <div class="book-grid" id="app-grid"></div>
</section>

<div id="site-footer"></div>

<script src="../assets/js/data.js?v=13"></script>
<script src="../assets/js/chrome.js?v=13"></script>
<script src="../assets/js/i18n.js?v=13"></script>
<script>
  const apps = [
    {
      id: "azaan-live",
      title: "Azaan Live",
      titleUrdu: "اذان مباشرة",
      tagline: "Masjid ki azaan seedhi broadcast karein, ya TV par jamaat ka waqt dikhayein.",
      logo: "../assets/img/azaan-live-logo.png",
    },
  ];
  document.getElementById("app-grid").innerHTML = apps.map(a => `
    <a href="${a.id}.html" class="book-card">
      <div class="book-cover" style="display:flex; align-items:center; justify-content:center; background:#fff; padding:24px;">
        <img src="${a.logo}" alt="${a.title}" style="width:100%; height:auto;">
      </div>
      <div class="book-meta">
        <div class="book-title-en" style="font-weight:600;">${a.title}</div>
        <div class="muted" style="font-size:13px; margin-top:4px;">${a.tagline}</div>
      </div>
    </a>`).join("");
</script>
</body>
</html>
