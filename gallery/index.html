<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adab Gallery — Bazm-e-Aziz</title>
<meta name="theme-color" content="#5c1a1b">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/main.css?v=8">
</head>
<body data-page="gallery">
<div class="grain"></div>
<div id="site-header"></div>

<section class="section" style="padding-bottom:16px;">
  <div class="eyebrow">Adab Gallery</div>
  <h1 style="font-size:34px;">Tasveerein, Yaadein aur Mehfilein</h1>
  <p class="muted" style="max-width:65ch; margin-top:10px;">
    Mushairon, mehfilon, Barabanki ke maqamaat aur Bazm-e-Aziz ki yaadgar
    tasveerein — sab ek jagah. Videos YouTube/Instagram/Facebook se seedhe
    yahan dikhti hain.
  </p>
</section>

<!-- ================= PHOTOS ================= -->
<section class="section section-tight" style="padding-top:10px;">
  <h2 style="font-size:24px; margin-bottom:18px;">📷 Tasveerein</h2>
  <div id="gallery-status" class="muted" style="font-family:var(--font-ui); font-size:14px; margin-bottom:16px;"></div>
  <div class="gallery-grid" id="gallery-grid"></div>
</section>

<!-- ================= DOCUMENTS ================= -->
<section class="section section-tight" id="docs-section" style="display:none;">
  <h2 style="font-size:24px; margin-bottom:18px;">📄 Dastawezaat</h2>
  <div id="docs-list" style="display:flex; flex-direction:column; gap:10px;"></div>
</section>

<!-- ================= VIDEOS & SOCIAL ================= -->
<section class="section section-tight" id="media-section" style="display:none;">
  <h2 style="font-size:24px; margin-bottom:18px;">🎬 Video &amp; Social</h2>
  <div class="media-grid" id="media-grid"></div>
</section>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" aria-label="Band karein">×</button>
  <img id="lightbox-img" src="" alt="">
  <div class="lightbox-caption" id="lightbox-caption"></div>
</div>

<div id="site-footer"></div>

<script src="../assets/js/data.js?v=15"></script>
<script src="../assets/js/chrome.js?v=15"></script>
<script src="../assets/js/i18n.js?v=15"></script>
<script src="../assets/js/media-hub.js?v=15"></script>
<script>
  const grid = document.getElementById("gallery-grid");
  const statusEl = document.getElementById("gallery-status");
  const lightbox = document.getElementById("lightbox");
  const lightboxImg = document.getElementById("lightbox-img");
  const lightboxCaption = document.getElementById("lightbox-caption");

  function esc(s) { return (s || "").replace(/</g, "&lt;").replace(/"/g, "&quot;"); }

  // ---- Photos (Cloudinary adab-gallery tag list) ----
  async function loadPhotos() {
    if (!MediaHub.isConfigured() && !MediaHub.config().cloudName) {
      statusEl.innerHTML = `Gallery abhi tayyar ho rahi hai — Cloudinary account jodte hi
        yahan tasveerein aa jayengi. <span style="opacity:0.6;">(Admin Panel &gt; Gallery &amp; Media)</span>`;
      return;
    }
    try {
      const items = await MediaHub.listGallery("image");
      if (!items || !items.length) {
        statusEl.textContent = "Abhi koi tasveer upload nahi hui.";
        return;
      }
      statusEl.textContent = "";
      // Nayi tasveerein pehle
      items.sort((a, b) => (b.created_at || "").localeCompare(a.created_at || ""));
      grid.innerHTML = items.map((r) => {
        const caption = r.context && r.context.custom && r.context.custom.caption ? r.context.custom.caption : "";
        return `
        <figure class="gallery-item" data-full="${MediaHub.imgUrl(r.public_id, { w: 1600, version: r.version })}" data-caption="${esc(caption)}">
          <img src="${MediaHub.thumbUrl(r.public_id, { version: r.version })}" alt="${esc(caption) || "Adab gallery tasveer"}" loading="lazy">
          ${caption ? `<figcaption class="gallery-caption">${esc(caption)}</figcaption>` : ""}
        </figure>`;
      }).join("");
    } catch {
      statusEl.innerHTML = `Tasveerein load nahi ho payin. Cloudinary Settings &gt; Security mein
        <strong>"Resource list"</strong> allowed hona chahiye.`;
    }
  }

  grid.addEventListener("click", (e) => {
    const item = e.target.closest(".gallery-item");
    if (!item) return;
    lightboxImg.src = item.dataset.full;
    lightboxCaption.textContent = item.dataset.caption || "";
    lightbox.classList.add("open");
  });
  lightbox.addEventListener("click", () => {
    lightbox.classList.remove("open");
    lightboxImg.src = "";
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") lightbox.classList.remove("open"); });

  // ---- Documents (raw uploads: PDFs waghaira) ----
  async function loadDocs() {
    if (!MediaHub.config().cloudName) return;
    try {
      const docs = await MediaHub.listGallery("raw");
      if (!docs || !docs.length) return;
      document.getElementById("docs-section").style.display = "";
      document.getElementById("docs-list").innerHTML = docs.map((r) => `
        <a class="card" style="display:flex; align-items:center; gap:12px; font-family:var(--font-ui);"
           href="${MediaHub.rawUrl(r.public_id, r.version)}" target="_blank" rel="noopener">
          📄 <span>${esc(r.public_id.replace(/^adab-gallery\//, ""))}</span>
        </a>`).join("");
    } catch {}
  }

  // ---- Videos & social links ----
  function renderMedia() {
    const media = (SITE_DATA.media || []).map((m) => ({ ...m, parsed: MediaHub.parseSocialLink(m.url) })).filter((m) => m.parsed);
    if (!media.length) return;
    document.getElementById("media-section").style.display = "";
    document.getElementById("media-grid").innerHTML = media.map((m, i) => {
      const p = m.parsed;
      const tall = p.platform === "instagram" || /shorts/.test(m.url);
      const posterStyle = p.thumb ? `style="background-image:url('${p.thumb}')"` : "";
      const inner = p.platform === "link"
        ? `<a class="media-poster" href="${esc(p.url)}" target="_blank" rel="noopener">
             <span class="media-play">↗</span><span class="media-platform">Kholein</span></a>`
        : `<button class="media-poster" data-embed="${esc(p.embed)}" data-idx="${i}" ${posterStyle}>
             <span class="media-play">▶</span><span class="media-platform">${p.label}</span></button>`;
      return `
      <div class="media-card">
        <div class="media-embed ${tall ? "media-embed--tall" : ""}">${inner}</div>
        <div class="media-meta">
          <span>${esc(m.title || p.label)}</span>
          <a href="${esc(p.url)}" target="_blank" rel="noopener">${p.label} par dekhein ↗</a>
        </div>
      </div>`;
    }).join("");

    // Click-to-load: iframe sirf tab load ho jab user chalaye (page halka rehta hai)
    document.getElementById("media-grid").addEventListener("click", (e) => {
      const btn = e.target.closest(".media-poster[data-embed]");
      if (!btn) return;
      const wrap = btn.parentElement;
      const iframe = document.createElement("iframe");
      iframe.src = btn.dataset.embed;
      iframe.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
      iframe.allowFullscreen = true;
      wrap.innerHTML = "";
      wrap.appendChild(iframe);
    });
  }

  loadPhotos();
  loadDocs();
  renderMedia();
</script>
</body>
</html>
