<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shayeri Archive — Talaash Karein</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/main.css">
</head>
<body data-page="poetry">
<div class="grain"></div>
<div id="site-header"></div>

<section class="section" style="padding-bottom:20px;">
  <div class="eyebrow">Deewan</div>
  <h1 style="font-size:40px; margin-bottom:14px;">Shayeri Archive</h1>
  <p class="muted" style="max-width:60ch;">
    Kisi sher, lafz, ya kitab ke naam se talaash karein — Urdu ya Roman
    dono rasm-ul-khat mein likh sakte hain.
  </p>
</section>

<section class="section section-tight" style="padding-top:0;">
  <div class="search-bar">
    <input type="text" id="search-input" placeholder="Talaash karein — jaise: ishq, وفا, ya kitab ka naam..." class="urdu" style="direction: auto;">
  </div>

  <div id="filter-row" style="display:flex; gap:10px; margin-bottom:30px; flex-wrap:wrap;"></div>

  <div id="results-count" class="muted" style="margin-bottom:20px; font-size:14px;"></div>
  <div id="poem-list"></div>
</section>

<div id="site-footer"></div>

<script src="../assets/js/data.js?v=16"></script>
<script src="../assets/js/components.js?v=16"></script>
<script src="../assets/js/chrome.js?v=16"></script>
<script src="../assets/js/i18n.js?v=16"></script>
<script>
  const searchInput = document.getElementById("search-input");
  const poemList = document.getElementById("poem-list");
  const resultsCount = document.getElementById("results-count");
  const filterRow = document.getElementById("filter-row");

  let activeBook = "all";

  const bookNames = ["all", ...new Set(SITE_DATA.poems.map(p => p.book))];
  filterRow.innerHTML = bookNames.map(name => `
    <button class="pill filter-pill" data-book="${name}" style="cursor:pointer; border:none; background:${name === 'all' ? 'var(--maroon)' : 'rgba(185,138,52,0.08)'}; color:${name === 'all' ? 'var(--paper)' : 'var(--maroon-deep)'};">
      ${name === "all" ? "Sab kitabein" : name}
    </button>`).join("");

  filterRow.addEventListener("click", (e) => {
    const btn = e.target.closest(".filter-pill");
    if (!btn) return;
    activeBook = btn.dataset.book;
    filterRow.querySelectorAll(".filter-pill").forEach(b => {
      const isActive = b.dataset.book === activeBook;
      b.style.background = isActive ? "var(--maroon)" : "rgba(185,138,52,0.08)";
      b.style.color = isActive ? "var(--paper)" : "var(--maroon-deep)";
    });
    render();
  });

  function render() {
    const q = searchInput.value.trim().toLowerCase();
    const filtered = SITE_DATA.poems.filter(p => {
      const matchesBook = activeBook === "all" || p.book === activeBook;
      const haystack = `${p.text} ${p.textUrdu} ${p.title} ${p.book} ${(p.tags || []).join(" ")}`.toLowerCase();
      const matchesQuery = q === "" || haystack.includes(q);
      return matchesBook && matchesQuery;
    });

    resultsCount.textContent = `${filtered.length} sher mile`;

    poemList.innerHTML = filtered.length
      ? filtered.map(p => `
        <article class="poem-card">
          <div class="poem-card-head">
            <span class="pill">${p.book}</span>
            <span class="muted" style="font-size:13px;">${p.title}</span>
          </div>
          <p class="poem-text">${p.textUrdu.replace(/\n/g, "<br>")}</p>
          <p class="poem-text-latin muted">${p.text.replace(/\n/g, "<br>")}</p>
        </article>`).join("")
      : `<div class="card center" style="padding:50px;">
          <p class="muted">Koi sher nahi mila. Kitabein upload hone ke baad archive mukammal hoga.</p>
        </div>`;
  }

  searchInput.addEventListener("input", render);
  render();
</script>
</body>
</html>
